name: Prüfen
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `actions/setup-php` existiert nicht. Der Commit ist auf setup-php 2.37.2 gepinnt,
      # damit die PHP-8.1-Prüfung reproduzierbar bleibt und keine bewegliche Action-Referenz lädt.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with: { php-version: '8.1' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: find mgd-notification-center -name '*.php' -exec php -l {} \;
      - run: node --check mgd-notification-center/assets/frontend.js
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/build-package.py
